openapi: 3.0.0
info:
  description: >-
    Service interface for Robot PI controller. Used for establishing a connection to the Robot PI server.
  title: Robot PI Server
  version: 1.0.0
servers:
  - url: http://robotpi.local
    description: Local Robot PI Server
paths:
  /connect:
    get:
      description:  >-
        Connect to the Robot PI server and establish a client connection. Only one client connection at a time is permitted. Client will automatically be disconnected if the connection is lost in excess of the timeout period defined in the server configuration.
      summary: >-
        Connect to the Robot PI server.
      responses:
        200:
          description: >-
            Success response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectResponse'
        500:
          description: >-
            Unsuccessful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectErrorResponse'
  /disconnect:
    post:
      description: >-
        Halt all streams and close the connection with the server.
      summary: >-
        Disconnect from the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisconnectRequest'
      responses:
        200:
          description: >-
            Success response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisconnectResponse'
components:
  schemas:
    ConnectResponse:
      type: object
      properties:
        message:
          type: string
    ConnectErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ConnectResponse'
        - type: object
          properties:
            errorCode:
              type: integer
    DisconnectRequest:
      type: object
      properties:
        shutdown:
          type: boolean
          default: false
          description: >-
            Tell the Raspberry PI server to disconnect and shutdown. The server will require a full system start to resume.
    DisconnectResponse:
      type: object
      properties:
        message:
          type: string
    ConfigurationModel:
      type: object
      description: >-
        Server configuration file model. A file 'config.json' MUST reside in the same folder as the service jar.
      required:
        - serverPort
        - serverBackLogging
      properties:
        serverIpAddress:
          type: string
          description: The server's IP address to bind to. Null binds to all interfaces.
          example: "localhost"
        serverPort:
          type: integer
          format: int32
          default: 8001
          example: 8001
        serverBackLogging:
          type: integer
          format: int32
          default: 0
          example: 0
        inputControlServerPort:
          type: integer
          format: int32
          default: 49801
          example: 49801
        audioStreamServer:
          $ref: '#/components/schemas/ConfigurationModelAudioStreamServer'
        videoStreamPort:
          type: integer
          format: int32
          default: 5000
          example: 5000
    ConfigurationModelAudioStreamServer:
      type: object
      properties:
        receivePort:
          type: integer
          format: int32
          default: 49809
          example: 49809
        sendPort:
          type: integer
          format: int32
          default: 49808
          example: 49808
        microphoneMixerName:
          type: string
          default: "Set [plughw:1,0]"
          description: Name of the ALSA audio mixer to use for microphone capture.
          example: "Set [plughw:1,0]"